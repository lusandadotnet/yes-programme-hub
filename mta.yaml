_schema-version: 3.3.0
ID: yes-programme-hub
version: 1.0.0
description: "YES Programme Lifecycle Hub"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: yes-programme-hub-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: yes-programme-hub-auth
      - name: yes-programme-hub-db
      - name: yes-programme-hub-destination

  - name: yes-programme-hub-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: yes-programme-hub-db

  - name: yes-programme-hub
    type: approuter.nodejs
    path: .deploy/app-router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: yes-programme-hub-auth
      - name: yes-programme-hub-destination
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: yes-programme-hub-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: yes-programme-hub-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'YES_Admin (yes-programme-hub ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.YES_Admin'
          - name: 'YES_Supervisor (yes-programme-hub ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.YES_Supervisor'
    requires:
      - name: app-api

  - name: yes-programme-hub-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: yes-programme-hub-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
